<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hextrap Artifacts</title>
<link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body data-base="{{.BaseURL}}">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#/repos" aria-label="hextrap Artifacts home">
    <svg class="brand-mark" viewBox="0 0 40 40" width="32" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="20,2 35,12 35,28 20,38 5,28 5,12" fill="none" stroke="currentColor" stroke-width="2"/>
      <polygon points="20,8 30,16 30,24 20,32 10,24 10,16" fill="currentColor" fill-opacity="0.1"/>
      <polygon points="20,12 26,18 26,22 20,28 14,22 14,18" fill="currentColor"/>
    </svg>
    <span class="brand-text"><span class="brand-name">hextrap</span><span class="brand-product">Artifacts</span></span>
  </a>
  <nav class="nav" aria-label="Main">
    <a class="nav-item" href="#/repos" data-section="repos"><svg class="icon" data-icon="box" aria-hidden="true"></svg><span>Repositories</span></a>
    <a class="nav-item" href="#/tokens" data-section="tokens"><svg class="icon" data-icon="key" aria-hidden="true"></svg><span>Access tokens</span></a>
    <a class="nav-item" href="#/account" data-section="account"><svg class="icon" data-icon="user" aria-hidden="true"></svg><span>Account</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="who">
      <span class="avatar" aria-hidden="true">{{.Initials}}</span>
      <span class="who-text"><span class="who-name">{{.Name}}</span><span class="who-role">{{.Role}}</span></span>
    </div>
    <div class="edition">{{.Edition}} edition</div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="topbar">
    <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><svg class="icon" data-icon="menu" aria-hidden="true"></svg></button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
    <form class="topbar-actions" method="post" action="/auth/logout">
      <button class="button button-ghost" type="submit"><svg class="icon" data-icon="logout" aria-hidden="true"></svg>Sign out</button>
    </form>
  </header>
  <main class="content" id="content" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/ui/app.js" defer></script>
</body>
</html>
