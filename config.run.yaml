# hextrap-artifacts: the minimal setup.
#
#   1. Create a password hash:   hextrap-artifacts hash-password
#   2. Paste it below, then run: hextrap-artifacts -config config.yaml
#   3. Sign in at http://localhost:8080, create an access token, and point
#      npm or pip at the repository (the page shows how).
#
# Everything else has defaults. See config.full.example.yaml for all settings,
# including single sign-on (OIDC) and Postgres.

users:
  - username: admin
    password_hash: pbkdf2-sha256$600000$4pHKSdljGjPaYtnMMWlwGw$XsaKSffeopD1aBF/3rPSpHCV99/MRpympAoN9JnFGJU
admins: [admin]

data_dir: /home/tim/Downloads/tmp/data
storage:
  # Local disk is for testing. For real use, store packages in S3:
  #   s3: {bucket: my-artifacts, region: us-east-1}
  filesystem: /home/tim/Downloads/tmp/data/blobs
